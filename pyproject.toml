[project]
name = "tcrm-toolkit"
version = "0.1.0"
description = "Salesforce Tableau CRM (TCRM) Analytics Toolkit - Async Python CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GNU Affero General Public License v3.0"}
authors = [
    {name = "Pedro Gagliardi", email = "pg-dev-git@users.noreply.github.com"}
]
keywords = ["salesforce", "tcrm", "analytics", "tableau", "cli", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.2.0",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
    "structlog>=24.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "authlib>=1.3.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.scripts]
tcrm = "tcrm_toolkit.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/pg-dev-git/foss_analytics_toolkit"
Repository = "https://github.com/pg-dev-git/foss_analytics_toolkit"
Issues = "https://github.com/pg-dev-git/foss_analytics_toolkit/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tcrm_toolkit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "T20",
]
# E = pycodestyle errors
# W = pycodestyle warnings
# F = pyflakes
# I = isort
# B = flake8-bugbear
# C4 = flake8-comprehensions
# UP = pyupgrade
# T20 = flake8-print
ignore = [
    "E501",
    "B008",
]
# E501 = line too long (handled by line-length)
# B008 = function calls in default argument

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]
# S101 = allow assert in tests
# S106 = allow hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.coverage.run]
source = ["tcrm_toolkit"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]